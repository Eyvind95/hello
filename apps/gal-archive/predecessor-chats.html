<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前輩原始聊天檔案館</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#edf2ff;font:16px system-ui;line-height:1.6}main{max-width:1000px;margin:auto;padding:24px}section{background:#202a41;border:1px solid #44516b;border-radius:12px;padding:18px;margin:16px 0}a{color:#a9c9ff}button,input,select{font:inherit;margin:4px;padding:8px;border-radius:8px}button{background:#6456b8;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#131b2e;padding:12px;border-radius:8px}select{max-width:100%}#status{white-space:pre-wrap}label{display:block}small{color:#b9c5da}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}</style><main>
<a href="./index.html">← 返回輪迴檔案館</a><h1>前輩原始聊天檔案館</h1><p>獨立保存 ChatGPT 渲染的聊天；不匯入 Gal AI 正史、不寫 Firebase。相同聊天依來源 ID 歸組，保留每次不同版本；失敗保全不會取代完成檔。</p>
<section><h2>匯入掃描 JSON</h2><label>原始聊天或未完成保全檔 <input type="file" id="raw" accept=".json,application/json"></label><button id="importRaw">匯入原始聊天</button><p><small>完整性以現場 DOM 首尾和重疊證據為限，非伺服器原始資料；附件參照不等於原檔。</small></p></section>
<section><h2>已收錄聊天</h2><select id="chats"></select><select id="versions"></select><div id="detail"></div><div class="row"><button id="downloadRaw">下載原始 JSON</button><button id="task">下載 GPT 分類任務 JSON</button><button id="downloadClass">下載分類 JSON</button></div><label>匯入 GPT 分類結果（引用原始訊息 ID，不複製 Gal AI 正史）<input id="classification" type="file" accept=".json,application/json"></label><button id="importClass">核對並收錄分類</button><div id="classes"></div><h3>原始聊天閱讀</h3><div class="row"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div><div id="messages"></div></section><p id="status" role="status"></p></main><script src="./chrome-extension/predecessor-chat-core.js?v=2"></script><script src="./predecessor-chats.js?v=1"></script></html>
