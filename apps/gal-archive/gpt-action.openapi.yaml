openapi: 3.1.0
info:
  title: 輪迴檔案館副駕駛自動歸檔
  version: 2.0.0
  description: 多輪迴通用：每次必須明確指定已存在且已上傳的輪迴 ID、實際副駕駛；不能覆蓋既有正史。部署後請替換 servers.url。
servers:
  - url: https://REPLACE-WITH-YOUR-DEPLOYED-FUNCTION-HOST
paths:
  /archiveIngest:
    post:
      operationId: appendArchiveMessages
      summary: 向指定輪迴新增玩家與副駕駛來源訊息
      description: 每次指定正確輪迴 cycleId，禁止因上一個聊天設定而沿用其他輪迴。一次一至十則，按原始順序；不提交推測劇情。一般玩家與 GPT 討論交由網站歸入副駕駛聊天，只有明確以我：／他：標記的原始劇情才會拆入完整對話。sourceId 同來源重試必須相同。
      security:
        - archiveToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [uid, cycleId, sourceId, manager, entries]
              properties:
                uid: {type: string, description: Firebase 登入 UID，從網站雲端同步頁取得}
                cycleId: {type: string, description: 指定輪迴 UUID，不能用輪迴名稱替代}
                sourceId: {type: string, description: 此次對話來源的唯一且重試保持不變識別碼}
                manager: {type: string, description: 此次紀錄實際負責的單一副駕駛名稱，必須列在該輪迴允許的管理者名單中；不得使用其他輪迴的負責人}
                entries:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [section, role, text]
                    properties:
                      section:
                        type: string
                        enum: [chat, quiz, changes]
                        description: chat=待分類的原始聊天；網站將按我：／他：標記辨別劇情及副駕駛討論；quiz=10題；changes=與皮卡修改紀錄
                      role:
                        type: string
                        enum: [me, ai]
                        description: me=皮卡（右）；ai=Gal AI 或負責 GPT（左）
                      text:
                        type: string
                        description: 原樣保存的完整原文，不加猜測、不補寫不存在的內容
      responses:
        '200':
          description: 新增或去重成功，資料仍在待收取區域
        '400': {description: 輸入格式有誤}
        '401': {description: Bearer 金鑰缺失}
        '403': {description: 金鑰無效、撤銷或負責人不符}
        '404': {description: 指定輪迴尚未上傳至 Firestore}
components:
  securitySchemes:
    archiveToken:
      type: http
      scheme: bearer
      description: 網站產生的 64 位十六進位寫入金鑰，設定在 GPT 動作 Authentication > API Key > Bearer。勿放在提示詞內。
