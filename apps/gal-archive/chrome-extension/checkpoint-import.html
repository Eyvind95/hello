<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>輪迴檔案館｜本機保全匯入</title><style>body{font:16px system-ui,sans-serif;background:#141b2d;color:#eef2ff;margin:0}main{max-width:720px;margin:30px auto;padding:24px}textarea{width:100%;box-sizing:border-box;min-height:100px;background:#222d45;color:white;border:1px solid #a5b4fc;padding:12px}button{padding:12px;margin:8px 8px 8px 0;border:1px solid #b5c1f6;border-radius:8px;background:#344467;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}label{display:block;margin:14px 0}</style></head><body><main><h1>本機保全匯入（免選檔）</h1><p>僅在擴充功能頁面貼入 GA1 Base64 分段。不連網、不上傳、不修改原始檔。</p><p>指定聊天：<code id="source"></code></p><p>預期 SHA-256：<code id="hash"></code></p><p>依序貼入每段（格式 GA1 1/總段數，換行後 Base64）。貼上後立即接收，輸入框不保留內容。</p><label for="chunk">本機保全分段</label><textarea id="chunk" rows="4" placeholder="點此後 Ctrl+V；每次一段" spellcheck="false" autocomplete="off"></textarea><p id="progress" role="status">尚未接收資料</p><button id="reset" type="button">清空未保存分段</button><button id="save" type="button" disabled>核對原始雜湊並記住保全</button><pre id="result" role="status"></pre><p>保存成功後清除剪貼簿，關閉本頁，返回原聊天點「使用已記住的保全續掃」。</p></main><script src="predecessor-chat-core.js"></script><script src="predecessor-checkpoint-memory.js"></script><script src="checkpoint-import.js"></script></body></html>
