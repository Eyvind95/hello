name: Gal Archive Legacy Migration Preview Tests
on:
  pull_request:
    paths:
      - 'apps/gal-archive/archive-legacy-pilot-migration-preview*'
      - '.github/workflows/gal-archive-legacy-migration.yml'
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/gal-archive/archive-legacy-pilot-migration-preview.test.cjs apps/gal-archive/chrome-extension/predecessor-chat-core.test.js
