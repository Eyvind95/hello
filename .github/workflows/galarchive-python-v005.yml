name: GalArchive Python V005 synthetic tests
on:
  push:
    branches: [feat/galarchive-python-local-v005]
  pull_request:
    branches: [feat/galarchive-python-local-v004]
  workflow_dispatch:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mcp==1.30.0'
      - run: python apps/gal-archive/local-python/galarchive_mcp_v005.py --self-test
      - run: |
          cd apps/gal-archive/local-python
          python -c "from pathlib import Path; p=Path('test_v003.py'); Path('test_batch_v005.py').write_text(p.read_text(encoding='utf-8').replace('galarchive_mcp_v003','galarchive_mcp_v005'),encoding='utf-8')"
          python -m unittest discover -p 'test_*v005.py' -v
