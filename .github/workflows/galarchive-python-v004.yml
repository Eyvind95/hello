name: GalArchive Python V004 synthetic tests
on:
  push:
    branches: [feat/galarchive-python-local-v004]
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mcp==1.30.0'
      - run: python apps/gal-archive/local-python/galarchive_mcp_v004.py --self-test
      - run: |
          cd apps/gal-archive/local-python
          sed 's/galarchive_mcp_v003/galarchive_mcp_v004/g' test_v003.py > test_batch_v004.py
          python -m unittest discover -p 'test_*v004.py' -v
