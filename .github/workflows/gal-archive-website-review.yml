name: Gal Archive Website Review Tests
on:
  pull_request:
    paths:
      - 'apps/gal-archive/**'
      - '.github/workflows/gal-archive-website-review.yml'
  push:
    branches: [main, feat/gal-archive-blue-review]
    paths:
      - 'apps/gal-archive/**'
      - '.github/workflows/gal-archive-website-review.yml'
permissions:
  contents: read
jobs:
  website-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify blue markers and existing scanner regressions
        run: |
          node --test apps/gal-archive/archive-special-review.test.js apps/gal-archive/archive-replay.test.js
          node --test apps/gal-archive/archive-auto-sync.test.js
          node --check apps/gal-archive/archive-auto-sync.js
          node --check apps/gal-archive/handover-cloud.js
          node --check apps/gal-archive/handover.js
          node --test apps/gal-archive/tools/predecessor-library.test.js apps/gal-archive/archive-reading-export.test.js
          node --check apps/gal-archive/archive-reading-export.js
          node --check apps/gal-archive/tools/predecessor-library.js
          node --check apps/gal-archive/archive-replay.js
          node --test apps/gal-archive/chrome-extension/predecessor-composite-dom.test.js apps/gal-archive/chrome-extension/predecessor-page-launcher.test.js apps/gal-archive/chrome-extension/predecessor-chat-core.test.js apps/gal-archive/tools/predecessor-chat-library.test.js
          node --check apps/gal-archive/chrome-extension/content.js
          node --check apps/gal-archive/predecessor-chats.js
          node --test apps/gal-archive/chrome-extension/gal-core.test.js apps/gal-archive/chrome-extension/gal-format-evidence.test.js apps/gal-archive/chrome-extension/gal-import.test.js apps/gal-archive/chrome-extension/gal-binding.test.js apps/gal-archive/chrome-extension/gal-scroll.test.js apps/gal-archive/chrome-extension/gal-scan-status.test.js apps/gal-archive/chrome-extension/gal-continue-audit.test.js
          node --test apps/gal-archive/tools/inspect-checkpoint.test.js apps/gal-archive/tools/inspect-1685-projections.test.js apps/gal-archive/tools/revalidate-checkpoint.test.js apps/gal-archive/tools/find-scan-batches.test.js
          node --check apps/gal-archive/chrome-extension/gal-core.js
          node --check apps/gal-archive/chrome-extension/gal-content.js
          node --check apps/gal-archive/sw.js
