name: Gal Archive Forensic Offline Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gal-archive-forensic-tests.yml'
      - 'apps/gal-archive/tools/inspect-checkpoint.js'
      - 'apps/gal-archive/tools/inspect-checkpoint.test.js'
      - 'apps/gal-archive/tools/inspect-player-surplus.js'
      - 'apps/gal-archive/tools/inspect-player-surplus.test.js'
      - 'apps/gal-archive/tools/inspect-1685-projections.js'
      - 'apps/gal-archive/tools/inspect-1685-projections.test.js'
      - 'apps/gal-archive/chrome-extension/gal-core.js'
      - 'apps/gal-archive/chrome-extension/gal-content.js'
      - 'apps/gal-archive/chrome-extension/gal-continue-audit.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and offline forensic regression tests
        run: |
          node --check apps/gal-archive/tools/inspect-1685-projections.js
          node --check apps/gal-archive/tools/inspect-checkpoint.js
          node --check apps/gal-archive/tools/inspect-player-surplus.js
          node --test apps/gal-archive/tools/inspect-checkpoint.test.js apps/gal-archive/tools/inspect-1685-projections.test.js apps/gal-archive/chrome-extension/gal-continue-audit.test.js apps/gal-archive/tools/inspect-player-surplus.test.js
          node --check apps/gal-archive/chrome-extension/gal-content.js
